name: run-nuclia-e2e-stage
run-name: Running e2e STAGE NUCLIA tests

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/run-e2e-nuclia-stage.yml'
      - 'nuclia_e2e/**'
  workflow_dispatch:  # Allow manual run from any branch
  schedule:
    # Run every day at 04:25
    - cron: '25 4 * * *'
jobs:
  build-virtual-env:
    runs-on: ubuntu-22.04
    name: Build virtual environment
    permissions:
      contents: read    # actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@18d369b23da25a81e9458561248e1aafff6a70fa # v10.3.1

      - name: Install venv
        run: uv sync --project nuclia_e2e

      - name: Upload virtualenv to cache
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nuclia_e2e/.venv
          key: venv-${{ github.sha }}

  pre-checks:
    runs-on: ubuntu-22.04
    name: Python pre-checks
    permissions:
      contents: read    # actions/checkout
    needs:
      - build-virtual-env
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nuclia_e2e/.venv
          key: venv-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run pre-checks
        run: |
          source nuclia_e2e/.venv/bin/activate
          make -C nuclia_e2e/ lint format-check

  test:
    runs-on: ubuntu-22.04
    name: e2e tests
    permissions:
      contents: read    # actions/checkout
      checks: write     # mikepenz/action-junit-report
    strategy:
      fail-fast: false
      matrix:
        shard_index: [0, 1, 2]  # Running tests in 3 parallel shards
    needs:
      - build-virtual-env
      - pre-checks

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore venv
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: nuclia_e2e/.venv
          key: venv-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Run tests (Shard ${{ matrix.shard_index }})
        env:
          STAGE_GCP_EUROPE1_NUA: ${{ secrets.STAGE_GCP_EUROPE1_NUA }}
          STAGE_PERMAMENT_ACCOUNT_OWNER_PAT_TOKEN: ${{ secrets.STAGE_PERMAMENT_ACCOUNT_OWNER_PAT_TOKEN }}
          STAGE_ROOT_PAT_TOKEN: ${{ secrets.STAGE_ROOT_PAT_TOKEN }}
          STAGE_GLOBAL_RECAPTCHA: ${{ secrets.STAGE_GLOBAL_RECAPTCHA }}
          TEST_GMAIL_APP_PASSWORD: ${{ secrets.TEST_GMAIL_APP_PASSWORD }}
          GOOGLE_DRIVE_CLIENT_SECRET: ${{ secrets.GOOGLE_DRIVE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_REFRESH_TOKEN: ${{ secrets.AZURE_REFRESH_TOKEN }}
          GRAFANA_URL: ${{ secrets.GRAFANA_URL }}
        run: |
          source nuclia_e2e/.venv/bin/activate && TEST_ENV=stage pytest -sxv -r fEs nuclia_e2e/nuclia_e2e/tests \
            --durations=0 --junitxml=nuclia-${{ matrix.shard_index }}.xml \
            --shard-id=${{ matrix.shard_index }} --num-shards=3

      - name: Publish Test Report
        uses: mikepenz/action-junit-report@6ef3fdcfcd5f0b5d14df3e659ef19b8c6820f93d # v6.6.1
        if: success() || failure() # always run even if the previous step fails
        with:
          report_paths: 'nuclia-*.xml' # Collect all test reports from parallel runs

  notify:
    if: ${{ failure() && github.ref_name == 'main' }}
    permissions: {}      # no token needed; Slack webhook uses a secret
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack notification
        uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3.0.5
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.NUA_E2E_SLACK_WEBHOOK }}
          payload: |
            {
              "text": "⚠️ Tests failed on STAGE\n${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            }

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_ID }}
          private-key: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_PK }}
          owner: nuclia
          repositories: tooling
          permission-contents: read

      - name: Checkout tooling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nuclia/tooling
          ref: main
          path: tooling
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Microsoft Teams notification
        id: teams
        uses: ./tooling/.github/actions/notify-microsoft-teams
        with:
          webhook-url: ${{ secrets.MS_TEAMS_WEBHOOK_URL_E2E }}
          title: "⚠️ NUA E2E STAGE tests failed"
          message: |
            Tests failed on STAGE
            ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
