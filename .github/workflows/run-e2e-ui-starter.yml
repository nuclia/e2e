name: run-e2e-ui-starter
run-name: Checking UI Starter
on:
  push:
    branches:
      - "**"
  workflow_dispatch:
  schedule:
    # Run at 00:25 and 12:25 on saturday and sunday
    - cron: "25 0,12 * * 0,6"
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: true
jobs:
  cypress-run:
    runs-on: ubuntu-22.04
    permissions:
      contents: read # actions/checkout
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      # Run ui-starter
      - run: |
          git clone https://github.com/nuclia/ui-starter.git
          cd ./ui-starter
          npm install
          npm run missdev
          npm run build
          npm run preview &
      - name: Install
        run: |-
          yarn install --immutable
          node_modules/.bin/cypress install
      - name: Cypress run
        id: cypress
        uses: cypress-io/github-action@f790eee7a50d9505912f50c2095510be7de06aa7 # v6.10.9
        with:
          spec: cypress/e2e/basic/5-ui-starter/ui-starter.cy.js
        env:
          CYPRESS_BASE_URL: https://stashify.cloud
          CYPRESS_BEARER_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
          CYPRESS_NUA_KEY: ${{ secrets.NUA_KEY }}
          CYPRESS_USER_NAME: ${{ secrets.USER_NAME }}
          CYPRESS_USER_PWD: ${{ secrets.USER_PWD }}
          CYPRESS_RUNNING_ENV: stage
          CYPRESS_UI_STARTER: true
        # after the test run completes store reports and any screenshots
      - name: Cypress reports
        id: report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ failure() && steps.cypress.conclusion == 'failure' }}
        with:
          name: cypress-reports
          path: cypress/reports
          if-no-files-found: ignore # 'warn' or 'error' are also available, defaults to `warn`
      - name: Slack notification
        id: slack
        uses: slackapi/slack-github-action@45a88b9581bfab2566dc881e2cd66d334e621e2c # v3.0.3
        if: ${{ failure() && steps.cypress.conclusion == 'failure' && github.ref_name == 'main' }}
        with:
          webhook-type: incoming-webhook
          webhook: ${{ secrets.SLACK_HOOK_URL }}
          payload: |
            {
              "text": "⚠️ UI Starter E2E failed\nTriggered by ${{ github.triggering_actor }} \nRun #${{ github.run_number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\nCypress report: ${{ steps.report.outputs.artifact-url }}"
            }

      - name: Generate a token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_ID }}
          private-key: ${{ secrets.NUCLIA_EXTERNAL_GHAPP_PK }}
          owner: nuclia
          repositories: tooling
          permission-contents: read

      - name: Checkout tooling repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: nuclia/tooling
          ref: main
          path: tooling
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Microsoft Teams notification
        id: teams
        uses: ./tooling/.github/actions/notify-microsoft-teams
        if: ${{ failure() && steps.cypress.conclusion == 'failure' && github.ref_name == 'main' }}
        with:
          webhook-url: ${{ secrets.MS_TEAMS_WEBHOOK_URL_E2E }}
          title: "⚠️ UI Starter E2E failed"
          message: |
            Triggered by ${{ github.triggering_actor }}
            Run #${{ github.run_number }}: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Cypress report: ${{ steps.report.outputs.artifact-url }}
